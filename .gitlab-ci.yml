stages:
  - lint
  - test
  - build
  - docker

variables:
  DB_PORT: 5432

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - deps
    - _build

.default-elixir:
  image: elixir:1.19.0
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get

lint-job:
  stage: lint
  extends: .default-elixir 
  variables:
    POSTGRES_USER: "local_postgres_user"
    POSTGRES_PASSWORD: "local_postgres_password"
    POSTGRES_DB: "local_postgres_database"
    SECRET_KEY_BASE: "local_secret_key_base"
  script:
    - mix format
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|main)/

test-job:
  stage: test
  extends: .default-elixir
  services:
    - name: postgres:18
      alias: postgres
  needs: ["lint-job"]
  variables:
    POSTGRES_USER: "local_postgres_user"
    POSTGRES_PASSWORD: "local_postgres_password"
    POSTGRES_DB: "local_postgres_database"
    SECRET_KEY_BASE: "local_secret_key_base"
    DB_HOST: "postgres"
  before_script:
    - apt update -y && apt install -y postgresql-client
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
    - until pg_isready -h $DB_HOST -U $POSTGRES_USER; do sleep 2; done
    - MIX_ENV=test mix ecto.create
    - MIX_ENV=test mix ecto.migrate
  script:
    - MIX_ENV=test mix test
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(feature|bugfix|hotfix|main)/

build-job:
  stage: build
  extends: .default-elixir
  needs: ["test-job"]
  script:
    - echo "Build the project"
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
    - mix compile --force
  artifacts:
    paths:
      - _build
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

docker-job:
  stage: docker
  needs: ["build-job"]
  image: docker:24.0
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs/client"
    MIX_ENV: prod
    IMAGE_TAG: $CI_COMMIT_SHA
  before_script:
    - echo "$GLCR_PASSWORD" |  docker login registry.gitlab.com -u $GLCR_USERNAME --password-stdin
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


